[package]
name = "esp32-wireguard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WireGuard VPN client for ESP32 in Rust"
repository = "https://github.com/yourusername/esp32-wireguard"
keywords = ["esp32", "wireguard", "vpn", "embedded", "iot"]
categories = ["embedded", "network-programming"]

[dependencies]
esp-idf-svc = "0.51"
log = "0.4"
anyhow = "1.0"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = "fat"

[package.metadata.esp-idf-sys]
extra_components = [
    { component_dirs = ["components"], bindings_header = "src/bindings.h", bindings_module = "wireguard" }
]
